name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display a message
        run: echo "Hello! My first GitHub Actions workflow is running."

      - name: Display README
        run: cat README.md